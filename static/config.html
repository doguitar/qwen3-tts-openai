<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qwen3 TTS Config</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 1.5rem; }
    main { max-width: 720px; margin: 0 auto; }
    nav { margin-bottom: 1.25rem; }
    nav a { color: #9cf; margin-right: 1rem; }
    dl { display: grid; grid-template-columns: 8rem 1fr; gap: 0.25rem 0.75rem; }
    dt { color: #aaa; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.35rem 0.4rem; border-bottom: 1px solid #333; }
    input { font: inherit; width: 100%; box-sizing: border-box; background: #1c1c1c; color: #eee; border: 1px solid #444; padding: 0.35rem; }
    button { font: inherit; background: #2a4a7a; color: #fff; border: 0; padding: 0.45rem 0.8rem; cursor: pointer; margin-right: 0.4rem; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status, #file-error, #readonly { min-height: 1.2em; }
    #rescanned { margin-top: 1rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <nav><a href="/">Generate</a><a href="/config">Config</a></nav>
    <h1>Voices</h1>
    <dl>
      <dt>path</dt><dd id="path"></dd>
      <dt>exists</dt><dd id="exists"></dd>
      <dt>writable</dt><dd id="writable"></dd>
      <dt>TTS_SPEAKERS</dt><dd id="speakers_env"></dd>
    </dl>
    <p id="file-error"></p>
    <p id="readonly"></p>
    <table>
      <thead><tr><th>Alias</th><th>Speaker</th><th>Model (optional)</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p>
      <button type="button" id="add">Add row</button>
      <button type="button" id="save">Save</button>
      <button type="button" id="rescan">Rescan models</button>
    </p>
    <p id="status"></p>
    <div id="rescanned"></div>
  </main>
  <script>
    const rowsEl = document.getElementById("rows");
    const addBtn = document.getElementById("add");
    const saveBtn = document.getElementById("save");
    const rescanBtn = document.getElementById("rescan");
    const statusEl = document.getElementById("status");
    const fileErrorEl = document.getElementById("file-error");
    const readonlyEl = document.getElementById("readonly");
    const rescannedEl = document.getElementById("rescanned");
    let writable = false;

    function errorDetail(data, fallback) {
      if (data && typeof data.detail === "string") return data.detail;
      if (data && data.detail != null) return JSON.stringify(data.detail);
      return fallback;
    }

    function addRow(alias, speaker, model) {
      const tr = document.createElement("tr");
      tr.innerHTML =
        '<td><input data-field="alias"></td>' +
        '<td><input data-field="speaker"></td>' +
        '<td><input data-field="model"></td>' +
        '<td><button type="button" data-remove>Remove</button></td>';
      tr.querySelector('[data-field="alias"]').value = alias || "";
      tr.querySelector('[data-field="speaker"]').value = speaker || "";
      tr.querySelector('[data-field="model"]').value = model || "";
      tr.querySelector("[data-remove]").addEventListener("click", () => tr.remove());
      rowsEl.appendChild(tr);
      applyWritable();
    }

    function applyWritable() {
      document.querySelectorAll("input, #add, #save, [data-remove]").forEach((el) => {
        el.disabled = !writable;
      });
      readonlyEl.textContent = writable ? "" : "voices.json is not writable";
    }

    function fillMeta(data) {
      document.getElementById("path").textContent = data.path || "";
      document.getElementById("exists").textContent = String(!!data.exists);
      document.getElementById("writable").textContent = String(!!data.writable);
      document.getElementById("speakers_env").textContent = data.speakers_env || "";
      writable = !!data.writable;
      fileErrorEl.textContent = data.error || "";
    }

    function fillTable(documentVoices) {
      rowsEl.innerHTML = "";
      const voices = (documentVoices && documentVoices.voices) || {};
      for (const [alias, spec] of Object.entries(voices)) {
        if (typeof spec === "string") addRow(alias, spec, "");
        else addRow(alias, (spec && spec.speaker) || "", (spec && spec.model) || "");
      }
      applyWritable();
    }

    function collectVoices() {
      const voices = {};
      for (const tr of rowsEl.querySelectorAll("tr")) {
        const alias = tr.querySelector('[data-field="alias"]').value.trim();
        const speaker = tr.querySelector('[data-field="speaker"]').value.trim();
        const model = tr.querySelector('[data-field="model"]').value.trim();
        if (!alias) continue;
        voices[alias] = model ? { speaker, model } : speaker;
      }
      return { voices };
    }

    function applyPayload(data) {
      fillMeta(data);
      fillTable(data.document);
    }

    saveBtn.addEventListener("click", async () => {
      if (!writable) return;
      statusEl.textContent = "";
      try {
        const res = await fetch("/ui/voices", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(collectVoices()),
        });
        const data = await res.json();
        if (!res.ok) {
          statusEl.textContent = errorDetail(data, res.statusText);
          return;
        }
        applyPayload(data);
        statusEl.textContent = "saved";
      } catch (err) {
        statusEl.textContent = String(err);
      }
    });

    addBtn.addEventListener("click", () => addRow("", "", ""));

    rescanBtn.addEventListener("click", async () => {
      statusEl.textContent = "";
      try {
        const res = await fetch("/ui/rescan", { method: "POST" });
        const data = await res.json();
        if (!res.ok) {
          statusEl.textContent = errorDetail(data, res.statusText);
          return;
        }
        const names = data.voices || [];
        statusEl.textContent = "rescanned";
        rescannedEl.textContent = names.join("\n");
      } catch (err) {
        statusEl.textContent = String(err);
      }
    });

    fetch("/ui/voices")
      .then((res) => res.json())
      .then(applyPayload)
      .catch((err) => { statusEl.textContent = String(err); });
  </script>
</body>
</html>
